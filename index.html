<!DOCTYPE html>
<html>

<head>
    <title>Anouar Khalil Azzouz</title>
    <link rel="icon" href="img/favicon/AK.png">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 0;
            background: black;
            font-family: 'Orbitron', sans-serif;
            color: white;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            overflow: hidden;
            perspective: 1000px;
        }

        .container {
            width: 100%;
            height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            position: relative;
        }

        .title {
            font-size: 150px;
            font-weight: 900;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            opacity: 0;
            animation:
                float 4s ease-in-out infinite,
                fadeIn 1s forwards 3s,
                glow 1.5s infinite alternate 3s;
            position: absolute;
            top: 5%;
            z-index: 0;
            transform-style: preserve-3d;
            color: #ffffff;
            text-shadow:
                0 0 5px rgba(255, 255, 255, 0.3);
            background: linear-gradient(90deg,
                    rgba(255, 255, 255, 0) 0%,
                    rgba(255, 255, 255, 0.8) 50%,
                    rgba(255, 255, 255, 0) 100%);
            -webkit-background-clip: text;
            background-clip: text;
        }

        .model-container {
            width: 100%;
            height: 100vh;
            position: absolute;
            top: 0;
            left: 0;
        }

        spline-viewer {
            width: 100%;
            height: 100%;
        }

        .button {
            padding: 1.2rem 2.5rem;
            font-size: 1.5rem;
            background: transparent;
            color: white;
            border: 2px solid rgba(255, 255, 255, 0.5);
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            text-decoration: none;
            z-index: 2;
            position: absolute;
            opacity: 0;
            bottom: 5%;
            backdrop-filter: blur(5px);
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            animation:
                float 5s ease-in-out infinite,
                fadeIn 1s forwards 4s;
        }

        .button:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: white;
            box-shadow:
                0 0 10px rgba(255, 255, 255, 0.2),
                0 0 20px rgba(255, 255, 255, 0.1),
                0 0 30px rgba(255, 255, 255, 0.05);
            transform: scale(1.05);
        }

        @keyframes float {
            0% {
                transform: translateY(0px) rotateX(10deg);
            }

            50% {
                transform: translateY(-20px) rotateX(-10deg);
            }

            100% {
                transform: translateY(0px) rotateX(10deg);
            }
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(-20px) scale(0.9);
            }

            to {
                opacity: 1;
                transform: translateY(0) scale(1);
            }
        }

        @keyframes glow {
            from {
                text-shadow:
                    0 0 1px #fff,
                    0 0 3px #fff,
                    0 0 5px #ffffff,
                    0 0 7px #ffffff,
                    0 0 10px #ffffff;
            }

            to {
                text-shadow:
                    0 0 3px #fff,
                    0 0 5px #fff,
                    0 0 10px #ffffff,
                    0 0 15px #ffffff,
                    0 0 20px #ffffff;
            }
        }

        /* Mobile Styles */
        @media (max-width: 768px) {
            .container {
                padding: 1rem;
            }

            .title {
                font-size: 4rem;
                text-align: center;
                top: 5%;
                width: 100%;
                padding: 0 1rem;
            }

            .button {
                bottom: 12%;
                padding: 1rem 2rem;
                font-size: 1.2rem;
                white-space: nowrap;
                min-width: 200px;
                text-align: center;
            }
        }

        @media (max-width: 375px) {
            .title {
                font-size: 3rem;
                top: 20%;
            }

            .button {
                padding: 0.8rem 1.5rem;
                font-size: 1rem;
                min-width: 180px;
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <h1 class="title">ANWRK</h1>
        <div class="model-container">
            <script type="module" src="https://unpkg.com/@splinetool/viewer@1.9.79/build/spline-viewer.js"></script>
            <spline-viewer url="https://prod.spline.design/b1UGzLr7MbuaBHw5/scene.splinecode"></spline-viewer>
        </div>
        <a href="main.html" class="button">Click here</a>
    </div>
</body>

</html>
